on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install pyinstaller openpyxl reportlab

      - name: exe bauen
        run: pyinstaller --noconsole --onefile --name "DSK-Film-Katalog" main.py

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: DSK-Film-Katalog
          path: dist/DSK-Film-Katalog.exe
